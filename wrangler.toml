# Garcar Payments — Cloudflare Workers (Primary Production)
# Hardened edge stack: FastAPI (lazy) + D1 + Queues + AutoKey secrets

name = "garcar-payments"
main = "app/entry.py"
compatibility_date = "2026-08-16"
compatibility_flags = ["python_workers"]

# ---------- D1 (edge SQLite) ----------
[[d1_databases]]
binding = "DB"
database_name = "garcar-payments-db"
database_id = "00000000-0000-0000-0000-000000000000"  # replaced on first `wrangler d1 create`

# ---------- Queues (Stripe durable processing) ----------
[[queues.producers]]
queue = "stripe-events"
binding = "STRIPE_QUEUE"

[[queues.consumers]]
queue = "stripe-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "stripe-events-dlq"

# ---------- Observability ----------
[observability]
enabled = true
head_sampling_rate = 1

# Secrets are pushed by AutoKey or `wrangler secret put`
# Never commit real secrets here.
