name: Deploy Landing Page to Vercel

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'checkout.html'
      - '.github/workflows/landing-page-deployment.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix Vercel Billing & Deploy
        run: |
          echo "🚀 VERCEL DEPLOYMENT WORKFLOW"
          echo ""
