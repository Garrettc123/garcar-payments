name: AutoKey Bootstrap to Railway

on:
  workflow_dispatch:
    inputs:
      app_base_url:
        description: 'The public URL of your deployed Railway app (e.g. https://garcar-payments.up.railway.app)'
        required: true

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  bootstrap:
    permissions:
      contents: read
    name: Generate & Push Secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Railway CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm install -g @railway/cli

      - name: Run AutoKey Sync
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          APP_BASE_URL: ${{ inputs.app_base_url }}
        run: python scripts/autokey_bootstrap.py
