name: 💓 Garcar Payments Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: 💓 Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check /health endpoint
        run: |
          URL="${{ secrets.RAILWAY_DEPLOY_URL }}"
          if [ -z "$URL" ]; then
            echo "⚠️ RAILWAY_DEPLOY_URL not set — skipping"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || echo "000")
          echo "Health → $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Service down (HTTP $STATUS)!"
            exit 1
          else
            echo "✅ Service healthy"
          fi
        env:
          RAILWAY_DEPLOY_URL: ${{ secrets.RAILWAY_DEPLOY_URL }}

      - name: Check MARS API tiers endpoint
        run: |
          URL="${{ secrets.RAILWAY_DEPLOY_URL }}"
          if [ -z "$URL" ]; then exit 0; fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/mars/api/tiers" || echo "000")
          echo "MARS tiers → $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ MARS tiers endpoint returned $STATUS"
          fi
        env:
          RAILWAY_DEPLOY_URL: ${{ secrets.RAILWAY_DEPLOY_URL }}

      - name: Check MRR endpoint
        run: |
          URL="${{ secrets.RAILWAY_DEPLOY_URL }}"
          if [ -z "$URL" ]; then exit 0; fi
          RESULT=$(curl -s "$URL/payments/mrr" || echo "{}")
          echo "MRR data: $RESULT"
        env:
          RAILWAY_DEPLOY_URL: ${{ secrets.RAILWAY_DEPLOY_URL }}
