name: Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_BASE_URL }}/health")
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Service healthy" || (echo "❌ Service down" && exit 1)
