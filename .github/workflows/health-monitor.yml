name: Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  ping:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "⚠️  APP_BASE_URL not configured — skipping health check"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_BASE_URL/health")
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Service healthy" || (echo "❌ Service down" && exit 1)
