name: Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_BASE_URL }}/health")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "HEALTH CHECK FAILED"
            exit 1
          fi
