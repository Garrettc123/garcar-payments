# Encrypted logical database backup with fail-closed preconditions.
# A successful workflow proves that an archive was created, encrypted, and
# reopened by pg_restore --list; it is NOT a full database restore drill.
name: Encrypted Database Backup and Archive Validation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Fail-closed encrypted backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install required database tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client openssl

      - name: Require backup configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL missing. Backup NOT performed."
            exit 1
          fi
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY missing. Backup NOT performed."
            exit 1
          fi

      - name: Create and encrypt PostgreSQL archive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR="$RUNNER_TEMP/garcar-backup"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          PLAIN="$BACKUP_DIR/backup.dump"
          trap 'rm -f "$PLAIN"' EXIT
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ENCRYPTED_FILE="$BACKUP_DIR/garcar_backup_${TIMESTAMP}.dump.enc"
          pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" > "$PLAIN"
          test -s "$PLAIN"
          pg_restore --list "$PLAIN" > /dev/null
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_ENCRYPTION_KEY -in "$PLAIN" -out "$ENCRYPTED_FILE"
          test -s "$ENCRYPTED_FILE"
          (
            cd "$BACKUP_DIR"
            sha256sum "$(basename "$ENCRYPTED_FILE")" > "$(basename "$ENCRYPTED_FILE").sha256"
          )
          echo "ENCRYPTED_FILE=$ENCRYPTED_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"
          echo "ENCRYPTED_NAME=$(basename "$ENCRYPTED_FILE")" >> "$GITHUB_ENV"
          echo "::notice::Encrypted backup generated. No plaintext dump uploaded."

      - name: Validate encrypted archive is readable
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          (
            cd "$BACKUP_DIR"
            sha256sum -c "$ENCRYPTED_NAME.sha256"
          )
          CHECK="$BACKUP_DIR/verify.dump"
          trap 'rm -f "$CHECK"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_ENCRYPTION_KEY -in "$ENCRYPTED_FILE" -out "$CHECK"
          pg_restore --list "$CHECK" > /dev/null
          echo "::notice::Archive decryption and pg_restore listing passed. No actual database restore was performed."

      - name: Store encrypted backup (30-day artifact retention)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: database-backup-${{ github.run_id }}
          path: |
            ${{ env.ENCRYPTED_FILE }}
            ${{ env.ENCRYPTED_FILE }}.sha256
          if-no-files-found: error
          retention-days: 30
