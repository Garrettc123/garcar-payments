name: Deploy garcar-payments

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Push to Railway
        run: railway up --detach

      - name: Sync Railway env vars
        run: |
          railway variables set \
            STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}' \
            STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET }}' \
            STRIPE_PRICE_STARTER='${{ secrets.STRIPE_PRICE_STARTER }}' \
            STRIPE_PRICE_PRO='${{ secrets.STRIPE_PRICE_PRO }}' \
            STRIPE_PRICE_AGENCY='${{ secrets.STRIPE_PRICE_AGENCY }}' \
            APP_BASE_URL='${{ secrets.APP_BASE_URL }}' \
            ENVIRONMENT=production

      - name: Health check
        run: |
          sleep 20
          curl -f "${{ secrets.APP_BASE_URL }}/health"
