name: Deploy garcar-payments

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --detach

      - name: Sync secrets to Railway
        run: |
          railway variables set \
            STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}' \
            STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET }}' \
            STRIPE_PRICE_STARTER='${{ secrets.STRIPE_PRICE_STARTER }}' \
            STRIPE_PRICE_PRO='${{ secrets.STRIPE_PRICE_PRO }}' \
            STRIPE_PRICE_AGENCY='${{ secrets.STRIPE_PRICE_AGENCY }}' \
            APP_BASE_URL='${{ secrets.APP_BASE_URL }}' \
            ENVIRONMENT=production

      - name: Health check
        run: |
          sleep 25
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_BASE_URL }}/health")
          [ "$STATUS" = "200" ] && echo "✅ Healthy" || (echo "❌ Health check failed: HTTP $STATUS" && exit 1)
