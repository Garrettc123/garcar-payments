# Production deployment — requires manual approval via the "production"
# GitHub Environment.  Never triggered automatically from a PR or push.
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (defaults to HEAD of main)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # For OIDC/keyless authentication to Railway

jobs:
  deploy:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    environment: production  # ← requires approval in GitHub Environment settings

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt pydantic-settings resend itsdangerous

      - name: Run tests before deploy
        run: python -m pytest tests/ -v --tb=short

      - name: Set up Node (for Railway CLI)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_BASE_URL/livez")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Deployment health check failed after 5 attempts."
          exit 1
