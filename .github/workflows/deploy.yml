name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve APP_BASE_URL
        id: resolve
        env:
          APP_BASE_URL_SECRET: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -n "$APP_BASE_URL_SECRET" ]; then
            echo "url=$APP_BASE_URL_SECRET" >> $GITHUB_OUTPUT
            echo "Using APP_BASE_URL from secret"
          else
            echo "url=https://garcar-payments.up.railway.app" >> $GITHUB_OUTPUT
            echo "Using hardcoded APP_BASE_URL fallback (garcar-payments.up.railway.app)"
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway authentication
        id: railway-auth
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "authenticated=false" >> $GITHUB_OUTPUT
            echo "::warning::RAILWAY_TOKEN is missing — skipping deploy step"
          elif railway whoami >/dev/null 2>&1; then
            echo "authenticated=true" >> $GITHUB_OUTPUT
            echo "Railway authentication OK"
          else
            echo "authenticated=false" >> $GITHUB_OUTPUT
            echo "::warning::RAILWAY_TOKEN is present but Railway CLI authentication failed — skipping deploy step"
          fi

      - name: Deploy to Railway
        if: steps.railway-auth.outputs.authenticated == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Wait for deployment
        if: steps.railway-auth.outputs.authenticated == 'true'
        run: sleep 20

      - name: Health check
        if: steps.railway-auth.outputs.authenticated == 'true'
        env:
          APP_BASE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_BASE_URL/health")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Deployment health check failed after 5 attempts."
          exit 1
