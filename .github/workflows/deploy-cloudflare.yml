name: Deploy to Cloudflare (Production)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (empty = HEAD of main)"
        required: false
        default: ""

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write  # OIDC login (kept from the old top-level permissions)
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Vendor Python modules via pywrangler
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --group dev
          uv run pywrangler --help
          uv run pywrangler sync || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv run pywrangler deploy --name garcar-payments

      - name: Health check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          URL="${APP_BASE_URL:-https://garcar-payments.garrettc123.workers.dev}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/hbody -w "%{http_code}" "$URL/health" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            cat /tmp/hbody 2>/dev/null || true
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 12
          done
          echo "Health check failed for $URL"
          exit 1
