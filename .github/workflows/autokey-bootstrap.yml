name: Autokey Bootstrap
# Run this ONCE manually from GitHub Actions UI.
# It reads secrets and deploys to Railway, syncs env vars,
# then registers the Stripe webhook automatically.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  autokey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Validate all required secrets exist ──────────────────────────────
      - name: Validate secrets present
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          MISSING=""
          [ -z "$RAILWAY_TOKEN" ]     && MISSING="$MISSING RAILWAY_TOKEN"
          [ -z "$STRIPE_SECRET_KEY" ] && MISSING="$MISSING STRIPE_SECRET_KEY"
          [ -z "$APP_BASE_URL" ]      && MISSING="$MISSING APP_BASE_URL"
          if [ -n "$MISSING" ]; then
            echo "Missing secrets:$MISSING"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "All required secrets present"

      # ── Install Railway CLI ──────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # ── Push code to Railway ─────────────────────────────────────────────
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      # ── Sync all env vars to Railway from GitHub secrets ─────────────────
      - name: Sync env vars to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variables set \
            STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}' \
            STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET }}' \
            LINEAR_API_KEY='${{ secrets.LINEAR_API_KEY }}' \
            NOTION_TOKEN='${{ secrets.NOTION_TOKEN }}' \
            SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            SUPABASE_SERVICE_KEY='${{ secrets.SUPABASE_SERVICE_KEY }}' \
            APP_BASE_URL='${{ secrets.APP_BASE_URL }}' \
            ENVIRONMENT='${{ inputs.environment }}'
          echo "Railway env vars synced"

      # ── Wait for Railway to boot then health check ───────────────────────
      - name: Wait and health check
        run: |
          echo "Waiting 30s for Railway to boot..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_BASE_URL }}/health")
          echo "Health check HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — check Railway logs"
            exit 1
          fi
          echo "Service healthy at ${{ secrets.APP_BASE_URL }}"

      # ── Install Stripe CLI ───────────────────────────────────────────────
      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" \
            | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update -qq && sudo apt-get install -y stripe

      # ── Register Stripe webhook (idempotent) ─────────────────────────────
      - name: Register Stripe webhook
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          WEBHOOK_URL="${APP_BASE_URL}/stripe-webhook"
          EXISTING=$(stripe webhook_endpoints list \
            --api-key "$STRIPE_SECRET_KEY" \
            --format json 2>/dev/null \
            | jq -r ".data[] | select(.url == \"$WEBHOOK_URL\") | .id" | head -n 1)

          if [ -n "$EXISTING" ]; then
            echo "Webhook already registered: $EXISTING"
          else
            OUTPUT=$(stripe webhook_endpoints create \
              --url "$WEBHOOK_URL" \
              --enabled-events checkout.session.completed,invoice.paid,invoice.payment_failed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,payment_intent.succeeded,payment_intent.payment_failed \
              --api-key "$STRIPE_SECRET_KEY" \
              --format json)
            WEBHOOK_SECRET=$(echo "$OUTPUT" | jq -r '.secret')
            echo "Webhook registered"
            echo "STRIPE_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> $GITHUB_ENV
            echo "::notice::Set STRIPE_WEBHOOK_SECRET=$WEBHOOK_SECRET in GitHub secrets and Railway dashboard"
          fi

      # ── Write STRIPE_WEBHOOK_SECRET back to Railway ──────────────────────
      - name: Write webhook secret to Railway
        if: env.STRIPE_WEBHOOK_SECRET != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variables set STRIPE_WEBHOOK_SECRET="${{ env.STRIPE_WEBHOOK_SECRET }}"
          echo "STRIPE_WEBHOOK_SECRET pushed to Railway"

      # ── Final status report ──────────────────────────────────────────────
      - name: Done
        run: |
          echo "GARCAR PAYMENTS AUTOKEY COMPLETE"
          echo "Service: ${{ secrets.APP_BASE_URL }}"
          echo "Webhook: ${{ secrets.APP_BASE_URL }}/stripe-webhook"
          echo "Environment: ${{ inputs.environment }}"
