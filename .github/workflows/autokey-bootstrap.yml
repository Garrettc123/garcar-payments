name: Autokey Bootstrap
# Run this ONCE manually from GitHub Actions UI.
# It reads secrets and deploys to Cloudflare Workers, syncs env vars,
# then registers the Stripe webhook automatically.
#
# Single source of truth for secret names: SECRETS.md

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  autokey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Resolve APP_BASE_URL (secret preferred, Workers domain as fallback) ──
      - name: Resolve APP_BASE_URL
        id: resolve
        env:
          APP_BASE_URL_SECRET: ${{ secrets.APP_BASE_URL }}
          GARCAR_PAYMENTS_URL: ${{ secrets.GARCAR_PAYMENTS_URL }}
        run: |
          if [ -n "$APP_BASE_URL_SECRET" ]; then
            echo "url=$APP_BASE_URL_SECRET" >> $GITHUB_OUTPUT
            echo "Using APP_BASE_URL from secret"
          elif [ -n "$GARCAR_PAYMENTS_URL" ]; then
            echo "url=$GARCAR_PAYMENTS_URL" >> $GITHUB_OUTPUT
            echo "Using GARCAR_PAYMENTS_URL alias"
          else
            echo "url=https://garcar-payments.workers.dev" >> $GITHUB_OUTPUT
            echo "Using hardcoded APP_BASE_URL fallback (garcar-payments.workers.dev)"
          fi

      # ── Validate all required secrets exist ──────────────────────────────
      - name: Validate secrets present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          MISSING=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "$STRIPE_SECRET_KEY" ] && MISSING="$MISSING STRIPE_SECRET_KEY"
          if [ -n "$MISSING" ]; then
            echo "Missing secrets:$MISSING"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Full list: see SECRETS.md in this repository"
            exit 1
          fi
          echo "All required secrets present"
          echo "APP_BASE_URL=${{ steps.resolve.outputs.url }}"

      # ── Install Cloudflare CLI ───────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      # ── Push code to Cloudflare Workers ──────────────────────────────────
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --name garcar-payments

      # ── Sync env vars to Cloudflare Worker from GitHub secrets ───────────
      - name: Sync env vars to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_AUDIT: ${{ secrets.STRIPE_PRICE_AUDIT }}
          STRIPE_PRICE_DEALDESK: ${{ secrets.STRIPE_PRICE_DEALDESK }}
          STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_AGENCY: ${{ secrets.STRIPE_PRICE_AGENCY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVENUE_DB_ID: ${{ secrets.NOTION_REVENUE_DB_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
        run: |
          vars=(
            STRIPE_SECRET_KEY
            STRIPE_PRICE_AUDIT
            STRIPE_PRICE_DEALDESK
            STRIPE_PRICE_STARTER
            STRIPE_PRICE_PRO
            STRIPE_PRICE_AGENCY
            LINEAR_API_KEY
            LINEAR_TEAM_ID
            NOTION_TOKEN
            NOTION_REVENUE_DB_ID
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            DATABASE_URL
            CORS_ALLOW_ORIGINS
          )

          for name in "${vars[@]}"; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --name garcar-payments
            fi
          done

          printf '%s' '${{ steps.resolve.outputs.url }}' | npx wrangler secret put APP_BASE_URL --name garcar-payments
          printf '%s' '${{ steps.resolve.outputs.url }}' | npx wrangler secret put GARCAR_PAYMENTS_URL --name garcar-payments
          printf '%s' '${{ inputs.environment }}' | npx wrangler secret put ENVIRONMENT --name garcar-payments
          echo "Cloudflare Worker secrets synced from GitHub secrets"

      # ── Wait for Worker to boot then health check ────────────────────────
      - name: Wait and health check
        run: |
          echo "Waiting 20s for Worker deploy to propagate..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.resolve.outputs.url }}/health")
          echo "Health check HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — check Cloudflare deploy output"
            # Soft-fail so webhook registration can still run if service is partially up
            echo "Continuing despite non-200 health check"
          else
            echo "Service healthy at ${{ steps.resolve.outputs.url }}"
          fi

      # ── Install Stripe CLI ───────────────────────────────────────────────
      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" \
            | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update -qq && sudo apt-get install -y stripe

      # ── Register Stripe webhook (idempotent) ─────────────────────────────
      - name: Register Stripe webhook
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_BASE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          WEBHOOK_URL="${APP_BASE_URL}/stripe-webhook"
          EXISTING=$(stripe webhook_endpoints list \
            --api-key "$STRIPE_SECRET_KEY" \
            --format json 2>/dev/null \
            | jq -r ".data[] | select(.url == \"$WEBHOOK_URL\") | .id" | head -n 1)

          if [ -n "$EXISTING" ]; then
            echo "Webhook already registered: $EXISTING"
          else
            OUTPUT=$(stripe webhook_endpoints create \
              --url "$WEBHOOK_URL" \
              --enabled-events checkout.session.completed,invoice.paid,invoice.payment_failed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,payment_intent.succeeded,payment_intent.payment_failed \
              --api-key "$STRIPE_SECRET_KEY" \
              --format json)
            WEBHOOK_SECRET=$(echo "$OUTPUT" | jq -r '.secret')
            echo "Webhook registered"
            echo "STRIPE_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> $GITHUB_ENV
            echo "::notice::Set STRIPE_WEBHOOK_SECRET=$WEBHOOK_SECRET in GitHub secrets and Cloudflare Worker secrets"
          fi

      # ── Write STRIPE_WEBHOOK_SECRET back to Cloudflare Worker ────────────
      - name: Write webhook secret to Cloudflare Worker
        if: env.STRIPE_WEBHOOK_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' '${{ env.STRIPE_WEBHOOK_SECRET }}' | npx wrangler secret put STRIPE_WEBHOOK_SECRET --name garcar-payments
          echo "STRIPE_WEBHOOK_SECRET pushed to Cloudflare Worker"

      # ── Final status report ──────────────────────────────────────────────
      - name: Done
        run: |
          echo "GARCAR PAYMENTS AUTOKEY COMPLETE"
          echo "Service: ${{ steps.resolve.outputs.url }}"
          echo "Webhook: ${{ steps.resolve.outputs.url }}/stripe-webhook"
          echo "Environment: ${{ inputs.environment }}"
          echo "All secrets pulled from GitHub Actions → Cloudflare Worker"
