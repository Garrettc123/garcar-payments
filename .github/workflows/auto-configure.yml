name: Full End-to-End Auto Configure (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]
      app_base_url:
        description: "Workers URL (e.g. https://garcar-payments.<subdomain>.workers.dev)"
        required: true
      skip_deploy:
        description: "Skip deploy steps"
        required: false
        default: false
        type: boolean

concurrency:
  group: autoconfigure-${{ inputs.environment }}
  cancel-in-progress: false

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  configure:
    permissions:
      contents: read
      id-token: write  # OIDC login (kept from the old top-level permissions)
    name: Auto Configure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Normalise APP_BASE_URL
        env:
          RAW: ${{ inputs.app_base_url }}
        run: |
          # Reject CR/LF before GITHUB_ENV. A newline would append extra env
          # records (BASH_ENV) that later secret-bearing steps would execute.
          if [[ "$RAW" == *$'\r'* || "$RAW" == *$'\n'* ]]; then
            echo "app_base_url must not contain CR or LF" >&2
            exit 1
          fi
          CLEAN="${RAW%/}"
          case "$CLEAN" in
            https://*|http://*) ;;
            *) echo "app_base_url must be an http(s) URL" >&2; exit 1 ;;
          esac
          echo "APP_BASE_URL=$CLEAN" >> "$GITHUB_ENV"
          echo "Normalised URL: $CLEAN"

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$STRIPE_SECRET_KEY" ]   && missing="$missing STRIPE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "Missing secrets:$missing"
            exit 1
          fi
          echo "Required secrets present"

      - name: Verify account identity and durable D1 binding before any write
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json, os, tomllib, urllib.request
          from pathlib import Path
          cfg = tomllib.loads(Path("wrangler.toml").read_text())
          dbs = cfg.get("d1_databases", [])
          if not any(x.get("binding") == "DB" and x.get("database_id") and
                     "PASTE_" not in x.get("database_id", "") for x in dbs):
              raise SystemExit("BLOCKED: real Cloudflare D1 DB binding is required")
          req = urllib.request.Request("https://api.stripe.com/v1/account")
          req.add_header("Authorization", "Bearer " + os.environ["STRIPE_SECRET_KEY"])
          with urllib.request.urlopen(req, timeout=15) as resp:
              account = json.load(resp)
          if account.get("id") != "acct_1RzegCAP6t2mSgAY":
              raise SystemExit("BLOCKED: Stripe key belongs to the wrong account")
          print("Active Stripe account identity and D1 binding verified")
          PY

      - name: Deploy Worker (bootstrap)
        if: ${{ inputs.skip_deploy != true && inputs.skip_deploy != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          npx wrangler deploy --name garcar-payments 2>&1 | tee deploy1.log
          tail -80 deploy1.log
          grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy1.log | head -1 > /tmp/workers_url.txt || true
          if [ -s /tmp/workers_url.txt ]; then
            DETECTED="$(cat /tmp/workers_url.txt)"
            echo "Detected Workers URL: $DETECTED"
            echo "WORKERS_URL=$DETECTED" >> $GITHUB_ENV
          fi

      - name: Push APP_BASE_URL as Wrangler secret
        if: ${{ inputs.skip_deploy != true && inputs.skip_deploy != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "$APP_BASE_URL" | npx wrangler secret put APP_BASE_URL --name garcar-payments

      - name: Run AutoKey (Queues + Stripe + Secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVENUE_DB_ID: ${{ secrets.NOTION_REVENUE_DB_ID }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DOWNLOAD_SIGNING_SECRET: ${{ secrets.DOWNLOAD_SIGNING_SECRET }}
        run: python3 scripts/autokey_bootstrap_cf.py

      - name: Redeploy after secrets
        if: ${{ inputs.skip_deploy != true && inputs.skip_deploy != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --name garcar-payments 2>&1 | tee deploy2.log

      - name: Payment readiness check
        if: ${{ inputs.skip_deploy != true && inputs.skip_deploy != 'true' }}
        run: |
          BASE_URL="${APP_BASE_URL}"
          sleep 15
          ok=0
          for try_url in "$BASE_URL" "${WORKERS_URL:-}"; do
            [ -z "$try_url" ] && continue
            echo "Probing $try_url/readyz"
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /tmp/hbody -w "%{http_code}" "$try_url/readyz" || echo "000")
              echo "  Attempt $i → HTTP $CODE"
              cat /tmp/hbody 2>/dev/null || true
              echo
              if [ "$CODE" = "200" ]; then
                echo "Healthy at $try_url"
                ok=1
                break 2
              fi
              sleep 8
            done
          done
          if [ "$ok" != "1" ]; then
            echo "Payment readiness failed: Cloudflare Worker must have queue, D1 and webhook signing secret." >&2
            exit 1
          fi

      - name: Summary
        if: success()
        env:
          INPUT_URL: ${{ inputs.app_base_url }}
        run: |
          echo "=============================================="
          echo " GARCAR CLOUDFLARE AUTO-CONFIGURE"
          echo "=============================================="
          echo "Input URL : ${INPUT_URL}"
          echo "Clean URL : ${APP_BASE_URL}"
          echo "Detected  : ${WORKERS_URL:-none}"
          echo "Webhook   : ${APP_BASE_URL}/stripe-webhook"
          echo "Queues    : stripe-events + stripe-events-dlq"
          echo "AutoKey   : completed only if every preceding step succeeded"
          echo "APP_BASE_URL secret pushed to Worker"
          echo "=============================================="
