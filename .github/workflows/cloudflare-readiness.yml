name: Cloudflare Readiness (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-readiness
  cancel-in-progress: true

jobs:
  cloudflare-inventory:
    name: Inventory account resources (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Inspect Workers, Queues, and D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare_readiness.py
