name: Register Stripe Webhook

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Railway"]
    types: [completed]

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  register-webhook:
    permissions: {}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Register or update webhook endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "⚠️  STRIPE_SECRET_KEY not configured — skipping webhook registration"
            exit 0
          fi

          if [ -z "$APP_BASE_URL" ]; then
            echo "⚠️  APP_BASE_URL not configured — skipping webhook registration"
            exit 0
          fi

          WEBHOOK_URL="${APP_BASE_URL}/stripe-webhook"
          echo "Registering webhook at: $WEBHOOK_URL"

          RESPONSE=$(curl -s -X POST https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_SECRET_KEY:" \
            -d "url=$WEBHOOK_URL" \
            -d "enabled_events[]=payment_intent.succeeded" \
            -d "enabled_events[]=payment_intent.payment_failed" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "enabled_events[]=customer.subscription.created" \
            -d "enabled_events[]=customer.subscription.updated" \
            -d "enabled_events[]=customer.subscription.deleted" \
            -d "enabled_events[]=invoice.paid" \
            -d "enabled_events[]=invoice.payment_failed")

          SECRET=$(echo "$RESPONSE" | jq -r '.secret // empty')
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ -n "$SECRET" ]; then
            # Mask the signing secret so it never appears in the (public) Actions log.
            echo "::add-mask::$SECRET"
            WID=$(echo "$RESPONSE" | jq -r '.id')
            echo "Webhook ID: $WID"
            echo ""
            echo "ACTION REQUIRED: copy the signing secret for webhook $WID from the Stripe dashboard and set STRIPE_WEBHOOK_SECRET in Railway and GitHub secrets (value intentionally not printed)"
          elif [ -n "$ERROR" ]; then
            echo "ERROR: $ERROR"
            exit 1
          else
            echo "Unexpected response: $RESPONSE"
            exit 1
          fi
