name: Register Stripe Webhook

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Railway"]
    types: [completed]

jobs:
  register-webhook:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Register or update webhook endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          WEBHOOK_URL="https://garcar-payments.vercel.app/payments/webhook/stripe"
          echo "Registering webhook at: $WEBHOOK_URL"

          RESPONSE=$(curl -s -X POST https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_SECRET_KEY:" \
            -d "url=$WEBHOOK_URL" \
            -d "enabled_events[]=payment_intent.succeeded" \
            -d "enabled_events[]=payment_intent.payment_failed" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "enabled_events[]=customer.subscription.created" \
            -d "enabled_events[]=customer.subscription.updated" \
            -d "enabled_events[]=customer.subscription.deleted" \
            -d "enabled_events[]=invoice.paid" \
            -d "enabled_events[]=invoice.payment_failed")

          echo "$RESPONSE" | python3 -c "
import json, sys
data = json.load(sys.stdin)
if 'secret' in data:
    print('Webhook ID: ' + data['id'])
    print('Signing Secret: ' + data['secret'])
    print('')
    print('ACTION REQUIRED: Set STRIPE_WEBHOOK_SECRET=' + data['secret'] + ' in Vercel dashboard and Railway dashboard')
elif 'error' in data:
    print('ERROR:', data['error']['message'])
    sys.exit(1)
"
