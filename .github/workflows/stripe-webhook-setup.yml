name: Stripe Webhook Setup

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create Stripe webhook endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "⚠️  STRIPE_SECRET_KEY not configured — skipping"
            exit 0
          fi

          if [ -z "$APP_BASE_URL" ]; then
            echo "⚠️  APP_BASE_URL not configured — skipping"
            exit 0
          fi

          WEBHOOK_URL="${APP_BASE_URL}/stripe-webhook"
          echo "Registering: $WEBHOOK_URL"

          RESPONSE=$(curl -s -X POST https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_SECRET_KEY:" \
            -d "url=$WEBHOOK_URL" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "enabled_events[]=customer.subscription.created" \
            -d "enabled_events[]=customer.subscription.updated" \
            -d "enabled_events[]=customer.subscription.deleted" \
            -d "enabled_events[]=invoice.paid" \
            -d "enabled_events[]=invoice.payment_failed" \
            -d "enabled_events[]=payment_intent.succeeded" \
            -d "enabled_events[]=payment_intent.payment_failed")

          echo "Response: $RESPONSE"

          echo "$RESPONSE" | python3 -c "
import json, sys
data = json.load(sys.stdin)
if 'secret' in data:
    print('SUCCESS')
    print('Webhook ID:', data['id'])
    print('Signing Secret:', data['secret'])
    print()
    print('=== ACTION REQUIRED ===')
    print('Set this in Railway and GitHub secrets:')
    print('  STRIPE_WEBHOOK_SECRET=' + data['secret'])
elif 'error' in data:
    print('ERROR:', data['error']['message'])
    sys.exit(1)
else:
    print('Unexpected response:', data)
    sys.exit(1)
"
