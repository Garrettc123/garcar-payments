# The historic push-to-main path called a reusable production pipeline.
# Manual-only invocation avoids surprise deployments from a safety patch.
name: Garcar Pipeline (manual release)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Destination after operator review
        required: true
        default: staging
        type: choice
        options: [staging, preview, production]

permissions: {}

jobs:
  production-approval:
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Approval checkpoint
        run: echo "GitHub production environment gate completed; no deployment executed here"

  pipeline:
    needs: production-approval
    if: ${{ always() && (inputs.environment != 'production' || needs.production-approval.result == 'success') }}
    permissions:
      contents: read
    uses: Garrettc123/garcar-control-plane/.github/workflows/garcar-deploy.yml@main
    with:
      service_name: garcar-payments
      environment: ${{ inputs.environment }}
      railway_service_id: ""
      deploy_edge_function: ""
      run_schema_migration: false
      notify_atlas: true
    secrets:
      RAILWAY_TOKEN:         ${{ secrets.RAILWAY_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL:       ${{ secrets.SUPABASE_DB_URL }}
      ATLAS_INGEST_URL:      ${{ secrets.ATLAS_INGEST_URL }}
      ATLAS_API_KEY:         ${{ secrets.ATLAS_API_KEY }}
      ECR_REGISTRY:          ${{ secrets.ECR_REGISTRY }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            ${{ secrets.AWS_REGION }}
