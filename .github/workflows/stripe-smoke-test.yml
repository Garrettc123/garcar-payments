name: Stripe Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      event:
        description: "Stripe event to trigger"
        required: false
        default: "payment_intent.succeeded"

jobs:
  stripe-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" \
            | sudo tee /etc/apt/sources.list.d/stripe.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y stripe
          stripe --version

      - name: Trigger Stripe test event
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "⚠️  STRIPE_SECRET_KEY not configured — skipping smoke test"
            exit 0
          fi
          stripe trigger ${{ github.event.inputs.event || 'payment_intent.succeeded' }} \
            --api-key "$STRIPE_SECRET_KEY"

      - name: Health check Railway endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "⚠️  APP_BASE_URL not configured — skipping health check"
            exit 0
          fi
          echo "Checking $APP_BASE_URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_BASE_URL/health")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED: HTTP $STATUS"
            exit 1
          fi
          echo "Health check PASSED"

      - name: Pricing endpoint check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "⚠️  APP_BASE_URL not configured — skipping pricing check"
            exit 0
          fi
          BODY=$(curl -fsS "$APP_BASE_URL/pricing")
          echo "$BODY" | jq -e '.plans | map(.key) | index("audit") != null' >/dev/null
          echo "$BODY" | jq -e '.plans | map(.key) | index("dealdesk") != null' >/dev/null
          echo "Pricing check PASSED (audit + dealdesk present)"

      - name: Checkout session check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "⚠️  APP_BASE_URL not configured — skipping checkout check"
            exit 0
          fi
          BODY=$(curl -fsS -X POST "$APP_BASE_URL/create-checkout-session" \
            -H 'Content-Type: application/json' \
            -d '{"plan":"audit","email":"test@example.com","source":"production-smoke-test"}')
          echo "$BODY" | jq -e '.checkout_url and (.checkout_url | type == "string") and (.checkout_url | startswith("https://"))' >/dev/null
          echo "Checkout check PASSED (checkout_url returned)"
