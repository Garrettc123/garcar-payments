name: Stripe Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      event:
        description: "Stripe event to trigger"
        required: false
        default: "payment_intent.succeeded"

jobs:
  stripe-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" \
            | sudo tee /etc/apt/sources.list.d/stripe.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y stripe
          stripe --version

      - name: Trigger Stripe test event
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          stripe trigger ${{ github.event.inputs.event || 'payment_intent.succeeded' }} \
            --api-key "$STRIPE_SECRET_KEY"

      - name: Health check Railway endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          echo "Checking $APP_BASE_URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_BASE_URL/health")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED: HTTP $STATUS"
            exit 1
          fi
          echo "Health check PASSED"
