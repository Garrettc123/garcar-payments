# Source validation only. This file deliberately does not report or trigger a deployment.
name: Payment API Validation (not deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/deploy-payments.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/deploy-payments.yml'

permissions:
  contents: read

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Regression suite (no real payments or remote calls)
        run: |
          python -m pytest -q tests/test_edge_queue.py tests/test_payment_fulfillment_gates.py tests/test_stripe_sig.py
      - name: Compile payment modules
        run: python -m compileall -q app
