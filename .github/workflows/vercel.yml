name: Vercel Status Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  vercel-status:
    permissions: {}
    name: Vercel Status Check
    runs-on: ubuntu-latest
    steps:
      - name: Vercel status check placeholder
        run: |
          echo "Vercel deployment is handled by Railway. This check always passes."
          exit 0