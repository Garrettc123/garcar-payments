name: Vault Secrets (Garcar Payments)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  pull:
    permissions:
      contents: read
      id-token: write  # OIDC login (kept from the old top-level permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require VAULT_ADDR
        run: |
          if [ -z "$VAULT_ADDR" ]; then
            echo "::error::Set VAULT_ADDR"
            exit 1
          fi

      - name: Import from Vault
        uses: hashicorp/vault-action@d1720f055e0635fd932a1d2a48f87a666a57906c # v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/stripe * ;
            secret/data/garcar/base * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;

      - name: Verify
        run: |
          for var in STRIPE_SECRET_KEY; do
            [ -n "${!var}" ] || { echo "missing $var"; exit 1; }
            echo "✅ $var"
          done
