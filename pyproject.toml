[project]
name = "garcar-payments"
version = "1.0.0"
description = "Garcar Payments on Cloudflare Workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.1",
    "resend>=2.0.0",
    "stripe>=10.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "workers-py>=1.9",
    "workers-runtime-sdk",
]

# Expose the documented Payments API (checkout + signed webhook + readiness).
# backend.mars_tiers:app is a separate MARS subscription showcase and does
# not implement the required payments webhook or fulfillment contract.
# Vercel only hosts the API: the durable fulfillment worker runs separately.
[tool.vercel]
entrypoint = "app.main:app"
